# Local dev overlay: like docker-compose.dev.yml, but backend/worker are built
# from Dockerfile.dev, which bakes in the dev/test group (pytest и др.) — so
# testing in-container works without ad-hoc installs. Source stays mounted from
# the host (./backend:/backend), so code edits are picked up live (uvicorn --reload).

# No container_name:, so this stack's containers get project-scoped names and can
# coexist with the default dev stack.

name: fullstack-dev-local

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    volumes:
      - ./backend:/backend
    env_file: ".env.dev"
    ports:
      - "8000:8000"
    depends_on:
      - backend-db
      - backend-redis
      - s3

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'worker', '-l', 'info' ]
    container_name: backend-worker
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
    depends_on:
      - backend-db
      - backend-redis
      - s3

  backend-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'beat', '-l', 'info', '--schedule', '/tmp/celerybeat-schedule' ]
    container_name: backend-beat
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
    depends_on:
      - backend-db
      - backend-redis
      - s3

  backend-db:
    image: postgres:latest
    container_name: backend-db
    ports:
      - "5433:5432"
    env_file: ".env.dev"
    volumes:
      - backend-db-volume:/var/lib/postgresql

  s3:
    image: minio/minio:latest
    container_name: test_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    environment:
      MINIO_ROOT_USER: $MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: $MINIO_ROOT_PASSWORD
      MINIO_REGION: $SERVICE_S3_FILES_REGION
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # Сервис для инициализации
  s3_init:
    image: minio/mc:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: $MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: $MINIO_ROOT_PASSWORD
      SERVICE_S3_FILES_BUCKET: $SERVICE_S3_FILES_BUCKET
      SERVICE_S3_FILES_CLIENT_ID: $SERVICE_S3_FILES_CLIENT_ID
      SERVICE_S3_FILES_CLIENT_SECRET: $SERVICE_S3_FILES_CLIENT_SECRET
    volumes:
      - ./scripts/s3-init.sh:/app/init.sh
    entrypoint: ["/app/init.sh"]

  backend-redis:
    image: redis:latest
    container_name: backend-redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"

volumes:
  backend-db-volume:
  s3_data: