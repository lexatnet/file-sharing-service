# Local dev overlay: like docker-compose.dev.yml, but backend/worker are built
# from Dockerfile.dev, which bakes in the dev/test group (pytest и др.) — so
# testing in-container works without ad-hoc installs. Source stays mounted from
# the host (./backend:/backend), so code edits are picked up live (uvicorn --reload).

# No container_name:, so this stack's containers get project-scoped names and can
# coexist with the default dev stack.

name: fullstack-dev-local

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    volumes:
      - ./backend:/backend
      - uploaded-files:/data/files
    env_file: ".env.dev"
    ports:
      - "8000:8000"
    depends_on:
      - backend-db
      - backend-redis

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'worker', '-l', 'info' ]
    container_name: backend-worker
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
      - uploaded-files:/data/files
    depends_on:
      - backend-db
      - backend-redis

  backend-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'beat', '-l', 'info', '--schedule', '/data/celerybeat-schedule' ]
    container_name: backend-beat
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
      - uploaded-files:/data/files
    depends_on:
      - backend-db
      - backend-redis

  backend-db:
    image: postgres:latest
    container_name: backend-db
    ports:
      - "5433:5432"
    env_file: ".env.dev"
    volumes:
      - backend-db-volume:/var/lib/postgresql

  backend-redis:
    image: redis:latest
    container_name: backend-redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"

volumes:
  backend-db-volume:
  uploaded-files: