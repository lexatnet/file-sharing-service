services:
  backend:
    build: ./backend
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    volumes:
      - ./backend:/backend
    env_file: ".env.dev"
    ports:
      - "8000:8000"
    depends_on:
      - backend-db
      # The API publishes the scan task to the Redis broker on every upload
      # (scan_file_for_threats.delay), so Redis must be up before the API.
      - backend-redis

  backend-worker:
    build: ./backend
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'worker', '-l', 'info' ]
    container_name: backend-worker
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
    depends_on:
      - backend-db
      - backend-redis

  backend-beat:
    build: ./backend
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'beat', '-l', 'info', '--schedule', '/tmp/celerybeat-schedule' ]
    container_name: backend-beat
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
    depends_on:
      - backend-db
      - backend-redis

  backend-db:
    image: postgres:latest
    container_name: backend-db
    # Postgres listens on 5432 inside the container; expose it on host 5433.
    ports:
      - "5433:5432"
    env_file: ".env.dev"
    volumes:
      - backend-db-volume:/var/lib/postgresql

  backend-redis:
    image: redis:latest
    container_name: backend-redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"

volumes:
  backend-db-volume:
